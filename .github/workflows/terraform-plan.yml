name: terraform plan

# The pull request gate. Everything that can be checked without touching real
# infrastructure runs here, and the resulting plan is posted to the PR so a
# reviewer sees exactly what merging would change.
#
# Authentication is via GitHub OIDC: the workflow exchanges a short-lived
# GitHub-signed token for temporary AWS credentials. There are no AWS access
# keys in this repository's secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - "monitoring/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the OIDC token
  pull-requests: write # required to post the plan comment

# One plan at a time per PR. A superseded run is cancelled rather than left to
# contend for the state lock with its own replacement.
concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  TFLINT_VERSION: "v0.64.0"
  AWS_REGION: us-east-1
  PROJECT_NAME: ce-capstone

jobs:
  validate:
    name: format, lint and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Formatting is checked before anything else: it is the cheapest failure
      # and the one most likely to make a diff unreadable in review.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init
          failed=0
          for dir in terraform/bootstrap terraform/modules/* terraform/environments/*; do
            [ -d "$dir" ] || continue
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl" --format=compact || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # Validate every module standalone as well as the environment roots, so a
      # module breaks its own build rather than only failing where it is used.
      - name: terraform validate
        run: |
          failed=0
          for dir in terraform/bootstrap terraform/modules/* terraform/environments/*; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate || failed=1
            echo "::endgroup::"
          done
          exit $failed

  policy-tests:
    name: policy unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The policies are checked before they are trusted to check anything
      # else. A rule that has silently stopped matching would otherwise pass
      # every plan without comment.
      - name: opa test
        run: opa test terraform/policy/ --verbose

      - name: opa fmt
        run: opa fmt --list --fail terraform/policy/

  security-scan:
    name: security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli

  plan:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [validate, policy-tests, security-scan]

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # Short-lived credentials from the read-only plan role. Its trust policy
      # only accepts tokens whose subject is a pull request or main on this
      # repository, so a fork cannot assume it.
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      # The bucket name embeds the account ID, so it is derived at runtime
      # rather than stored as another variable that could drift.
      - name: resolve state backend
        id: backend
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=${PROJECT_NAME}-tfstate-${account_id}" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform -chdir=terraform/environments/${{ matrix.environment }} init \
            -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${PROJECT_NAME}/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=terraform/environments/${{ matrix.environment }} plan \
            -input=false -lock-timeout=5m -no-color \
            -out=tfplan -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e

          # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
          if [ $code -eq 1 ]; then
            cat plan.txt
            exit 1
          fi

          echo "has_changes=$([ $code -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt > plan_trimmed.txt
          terraform -chdir=terraform/environments/${{ matrix.environment }} show -json tfplan > tfplan.json

      # The gate that makes the policies real. Evaluated against the plan JSON,
      # so it sees resolved variables, expanded modules and merged default_tags
      # -- the actual intent, not the source text.
      - name: policy gate
        run: |
          violations=$(opa eval \
            --format raw \
            --data terraform/policy/ \
            --input terraform/environments/${{ matrix.environment }}/tfplan.json \
            'data.main.deny')

          count=$(echo "$violations" | jq 'length')

          if [ "$count" -gt 0 ]; then
            echo "::error::${count} policy violation(s) in the ${{ matrix.environment }} plan"
            echo "$violations" | jq -r '.[] | "  - " + .'
            {
              echo "### Policy violations — ${{ matrix.environment }}"
              echo
              echo "$violations" | jq -r '.[] | "- " + .'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "No policy violations."
          echo "Policy gate passed for **${{ matrix.environment }}**." >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ github.workspace }}

      - name: comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const plan = fs.readFileSync(
              `terraform/environments/${env}/plan_trimmed.txt`, 'utf8');

            const marker = `<!-- terraform-plan:${env} -->`;
            const summary = process.env.HAS_CHANGES === 'true'
              ? 'This plan **will change infrastructure**.'
              : 'No infrastructure changes.';

            const body = [
              marker,
              `### Terraform plan — \`${env}\``,
              '',
              `${summary} Policy gate, checkov and tflint all passed.`,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Update the existing comment for this environment rather than
            // adding a new one on every push, so the PR stays readable.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
